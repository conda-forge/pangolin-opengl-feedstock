{% set name = "pangolin-opengl" %}
{% set version = "0.9.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/stevenlovegrove/Pangolin/archive/refs/tags/v{{ version }}.tar.gz
  sha256: b4fa363e68d076bec70b48f9aaa176575e399033f93b705c795dd36a7ea24919
  patches:
    - patches/0001-remove-werror.patch
    - patches/0002-fix-tinyobj-uninit.patch
    - patches/0003-find-threads-in-config.patch

build:
  number: 1
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - ninja
    - cmake
    - pkg-config
  host:
    - catch2
    - eigen
    - epoxy
    - fmt
    - glew
    - libegl-devel       # [linux]
    - libgl-devel        # [linux]
    - libglu             # [linux]
    - libglvnd-devel     # [linux]
    - libglx-devel       # [linux]
    - libopengl-devel    # [linux]
    - libpng
    - libxkbcommon       # [linux]
    - spdlog
    - xorg-libx11        # [linux]
    - xorg-libxext       # [linux]
    - xorg-libxfixes     # [linux]
    - zstd
  run:
    - xorg-libx11
    - zstd

test:
  commands:
    - test -f $PREFIX/lib/cmake/Pangolin/PangolinConfig.cmake  # [not win]
    - cmake -S tests -B tests/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PREFIX  # [not win]
    - cmake --build tests/build --config Release  # [not win]
    - ctest --test-dir tests/build --output-on-failure  # [not win]
    - if not exist %PREFIX%\\Library\\lib\\cmake\\Pangolin\\PangolinConfig.cmake exit 1  # [win]
    - cmake -S tests -B tests\\build -DCMAKE_PREFIX_PATH=%LIBRARY_PREFIX%  # [win]
    - cmake --build tests\\build --config Release  # [win]
    - ctest --test-dir tests\\build --output-on-failure -C Release  # [win]
  requires:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - eigen
    - libegl-devel       # [linux]
    - libgl-devel        # [linux]
    - libopengl-devel    # [linux]
    - ninja              # [not win]
  files:
    - tests/

about:
  home: https://github.com/stevenlovegrove/Pangolin.git
  license: MIT
  license_file: LICENCE
  summary: Pangolin - A set of lightweight and portable utility libraries for prototyping 3D, numeric or video based programs and algorithms.
  dev_url: https://github.com/stevenlovegrove/Pangolin

extra:
  recipe-maintainers:
    - jeongseok-meta
